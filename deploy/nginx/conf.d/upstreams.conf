# Upstream Definitions with Connection Pooling (Keepalive)

# PHP-FPM Backend Pool
upstream php_backend {
    server unix:/run/php/php8.2-fpm.sock max_fails=3 fail_timeout=10s;
    # Or TCP: server 127.0.0.1:9000;
    
    # Maintain open sockets to PHP-FPM to eliminate connection setup overhead
    keepalive 32;
}

# Laravel Reverb WebSocket Cluster
# Uses ip_hash or sticky routing for WebSocket affinity, while Reverb handles horizontal scaling via Redis Pub/Sub
upstream reverb_backend {
    ip_hash;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    # When scaling to multiple Reverb instances across cores or servers:
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;

    keepalive 64;
}
