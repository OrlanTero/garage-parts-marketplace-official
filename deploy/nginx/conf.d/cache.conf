# FastCGI Cache Path for Laravel API Microcaching
# - keys_zone: 100MB shared memory zone stores ~800,000 cache keys
# - max_size: 2GB disk limit
# - inactive: Items not accessed within 60m are evicted
# - use_temp_path=off: Writes directly to cache directory, avoiding duplicate disk copy
fastcgi_cache_path /var/cache/nginx/fastcgi_api
    levels=1:2
    keys_zone=API_CACHE:100m
    max_size=2g
    inactive=60m
    use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Determine whether the request should bypass or skip caching
# Default: 0 (allow caching for public GET/HEAD requests)
map $request_method $no_cache_method {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}

# Bypass cache if Authorization header (Bearer token) is present
map $http_authorization $no_cache_auth {
    default 0;
    "~.+"   1;
}

# Bypass cache if Laravel session or remember cookie is present
map $http_cookie $no_cache_cookie {
    default 0;
    "~*laravel_session" 1;
    "~*remember_token"  1;
}

# Bypass cache if query parameter nocache=1 is sent
map $arg_nocache $no_cache_arg {
    default 0;
    1       1;
}
