# Rate Limiting Zones
# Protects origin PHP workers and Reverb WebSocket nodes from burst floods

# General API requests: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;

# Auth endpoints (login, register, oauth): 5 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# WebSocket handshake upgrades: 15 connections/second per IP
limit_req_zone $binary_remote_addr zone=ws_handshake:10m rate=15r/s;

# Return HTTP 429 Too Many Requests when limits are exceeded
limit_req_status 429;
