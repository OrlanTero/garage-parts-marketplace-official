# WebSocket Reverse Proxy Configuration for Laravel Reverb / Pusher Protocol

proxy_pass http://reverb_backend;
proxy_http_version 1.1;

# Protocol upgrade headers
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Client context headers
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Long timeouts for persistent WebSocket connections (24 hours)
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_connect_timeout 10s;

# Disable proxy buffering for zero latency packet delivery
proxy_buffering off;
proxy_cache_bypass $http_upgrade;
