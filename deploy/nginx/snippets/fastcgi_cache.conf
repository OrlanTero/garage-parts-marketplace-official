# FastCGI Microcaching Directives
# Caches dynamic GET responses for a short interval (e.g. 5-30s) while ensuring instant bypass on mutations / auth

# Aggregate skip flags
set $skip_cache 0;

if ($no_cache_method) {
    set $skip_cache 1;
}
if ($no_cache_auth) {
    set $skip_cache 1;
}
if ($no_cache_cookie) {
    set $skip_cache 1;
}
if ($no_cache_arg) {
    set $skip_cache 1;
}

# Attach to API_CACHE zone
fastcgi_cache API_CACHE;
fastcgi_cache_bypass $skip_cache;
fastcgi_no_cache $skip_cache;

# Microcache public successful responses for 10 seconds
fastcgi_cache_valid 200 301 302 10s;
fastcgi_cache_valid 404 1m;

# Stale cache protection: Serves stale response while fetching new one to prevent thundering herd
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
fastcgi_cache_background_update on;

# Cache locking: Only one request populates the cache while others wait
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;

# Expose cache status header (HIT, MISS, BYPASS, EXPIRED, STALE, UPDATING)
add_header X-Cache-Status $upstream_cache_status always;
