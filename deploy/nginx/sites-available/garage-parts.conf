# ==============================================================================
# Garage Parts Marketplace — Production Nginx Site Configuration
# ==============================================================================
# Features:
#  1. Static Asset Caching (Vite build with immutable hashes, 1-year max age)
#  2. SPA Fallback Routing (Zero-cache on index.html for instant updates)
#  3. FastCGI Microcaching for Laravel API with automated bypass logic
#  4. Scalable Reverse Proxy for Laravel Reverb WebSockets (HTTP/1.1 Upgrade)
#  5. Rate Limiting Zones (API, Auth, and WebSocket handshakes)
#  6. Production Security Headers & Gzip Compression
# ==============================================================================

# --- TOPOLOGY OPTION A: Multi-Domain Architecture ---

# 1. Frontend SPA (Vite Production Build)
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    root /var/www/garage-parts/frontend/dist;
    index index.html;

    include /etc/nginx/snippets/security_headers.conf;

    # Static Assets with Hash in filename (Vite /assets/*)
    # Cached for 1 year with immutable flag
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static Media / Logos / Favicons
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # SPA Entrypoint & Fallback (index.html)
    # Must NOT be cached long-term to allow immediate frontend releases
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# 2. Backend API (Laravel 12 + FastCGI Microcaching)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    root /var/www/garage-parts/backend/public;
    index index.php;

    include /etc/nginx/snippets/security_headers.conf;

    # Rate limiting on general API
    limit_req zone=api_general burst=50 nodelay;

    # Auth rate limiting
    location ~* ^/api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Execution with Microcaching
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass php_backend;

        # FastCGI Microcache rules
        include /etc/nginx/snippets/fastcgi_cache.conf;

        # FastCGI Buffers
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_temp_file_write_size 32k;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# 3. WebSocket Gateway (Laravel Reverb Cluster)
server {
    listen 80;
    listen [::]:80;
    server_name ws.example.com;

    include /etc/nginx/snippets/security_headers.conf;

    location / {
        limit_req zone=ws_handshake burst=30 nodelay;
        include /etc/nginx/snippets/websocket_proxy.conf;
    }
}

