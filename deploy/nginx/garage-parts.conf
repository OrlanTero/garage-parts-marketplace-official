# Nginx — Ubuntu production front for Laravel public/ + Vite dist/
# Deploy: /etc/nginx/sites-available/garage-parts → sites-enabled

# --- API (Laravel) ---
server {
    listen 80;
    server_name api.example.com;

    root /var/www/garage-parts/backend/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Laravel pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# --- Frontend (Vite build output) ---
server {
    listen 80;
    server_name app.example.com;

    root /var/www/garage-parts/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api to Laravel instead of exposing api subdomain
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    # }
}

