# ==============================================================================
# Garage Parts Marketplace — Self-Contained / Standalone Production Nginx Config
# ==============================================================================
# Deploy: /etc/nginx/sites-available/garage-parts -> /etc/nginx/sites-enabled/
# ==============================================================================

# --- UPSTREAMS ---
upstream php_backend {
    server unix:/run/php/php8.2-fpm.sock max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream reverb_backend {
    ip_hash;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# --- WEBSOCKET UPGRADE MAPPING (if not in nginx.conf) ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- CACHE BYPASS MAPPINGS ---
map $request_method $no_cache_method {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}

map $http_authorization $no_cache_auth {
    default 0;
    "~.+"   1;
}

map $http_cookie $no_cache_cookie {
    default 0;
    "~*laravel_session" 1;
    "~*remember_token"  1;
}

map $arg_nocache $no_cache_arg {
    default 0;
    1       1;
}

# ==============================================================================
# 1. API SERVER (Laravel 12 + FastCGI Microcaching)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    root /var/www/garage-parts/backend/public;
    index index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting (define limit_req_zone in http block)
    # limit_req zone=api_general burst=50 nodelay;

    # Laravel Pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Execution with Microcaching
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass php_backend;

        # Microcache Evaluation
        set $skip_cache 0;
        if ($no_cache_method) { set $skip_cache 1; }
        if ($no_cache_auth)   { set $skip_cache 1; }
        if ($no_cache_cookie) { set $skip_cache 1; }
        if ($no_cache_arg)    { set $skip_cache 1; }

        fastcgi_cache API_CACHE;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_valid 200 301 302 10s;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;

        add_header X-Cache-Status $upstream_cache_status always;

        # Buffer Optimization
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_temp_file_write_size 32k;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==============================================================================
# 2. FRONTEND SPA SERVER (Vite Build + Static Asset Cache)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    root /var/www/garage-parts/frontend/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite Hashed Assets: Cache forever (1 year immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static Images, Fonts, Favicons
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # SPA Entrypoint: Zero Cache to ensure instant frontend rollouts
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==============================================================================
# 3. WEBSOCKET SERVER (Laravel Reverb Cluster)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2; # (Uncomment when SSL is enabled)
    server_name ws.example.com;

    # SSL configuration (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;

    location / {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for WebSocket heartbeats
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
